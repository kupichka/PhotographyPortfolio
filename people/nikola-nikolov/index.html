<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Никола Николов | Борислав Дочев</title>
  <meta name="description" content="Никола Николов - хора и изпълнители, заснети от Борислав Дочев">
  
  <meta property="og:title" content="Никола Николов | Борислав Дочев">
  <meta property="og:description" content="Никола Николов - хора и изпълнители, заснети от Борислав Дочев">
  <meta property="og:image" content="https://photos.kupichka.org/images/thumb/people-nikola-nikolov.webp">
  <meta property="og:image:width" content="540">
  <meta property="og:image:height" content="594">
  <meta property="og:image:alt" content="Момче в бежава тениска държи фотоапарат, докато гледа към камерата">
  <meta property="og:url" content="https://photos.kupichka.org/events">
  <meta property="og:type" content="website">
  
  <link href="/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/nanogallery2@3/dist/css/nanogallery2.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navigation">
    <h1 class="navigation-name">
      <a href="/">Борислав Дочев</a>
    </h1>
    
    <button class="menu-toggle" aria-expanded="false" aria-controls="navigation-links" aria-label="Превключване на менюто">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>

    <div class="navigation-right" id="navigation-links">
      <div class="navigation-events">
        <a href="/events">Събития</a>
      </div>
      <div class="navigation-people">
        <a href="/people">Хора</a>
      </div>
      <div class="navigation-about">
        <a href="/about/">За мен</a>
      </div>
    </div>
  </nav>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nav = document.querySelector('.navigation');
      const toggle = document.querySelector('.menu-toggle');
      if (!nav || !toggle) return;
      toggle.addEventListener('click', () => {
        const isOpening = !nav.classList.contains('is-open');
        if (isOpening) {
          nav.classList.add('is-open');
          document.body.classList.add('no-scroll');
          toggle.setAttribute('aria-expanded', 'true');
        } else {
          nav.classList.remove('is-open');
          document.body.classList.remove('no-scroll');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });
    });
  </script>
  <h2>Никола Николов</h2>
  <img src="/images/thumb/people-nikola-nikolov.webp" style="max-width: 100%;">
  
</body>
</html>
