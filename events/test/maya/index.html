<html lang="bg">
<head>

  <title>Мая</title>
  
  <meta property="og:title" content="Мая">
  <meta property="og:description" content="Фотогалерия от награждаването на Първото регионално STEM състезание, както и изпълнението на песен на Nightwish от групата Асфодел на НПМГ.">

  <meta property="og:image:height" content="1345">
  <meta property="og:url" content="https://photos.kupichka.org/events/2026_05_29/">

  <link rel="preload" href="/fonts/forum-custom.woff2" as="font" type="font/woff2" crossorigin>
  <link href="/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/nanogallery2@3/dist/css/nanogallery2.min.css" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <style>
html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: white;
    font-family: sans-serif;
}

.viewer {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    box-sizing: border-box;
    gap: 10px;
}

.image-container {
    flex: 1;
    min-height: 0;          /* Important for flexbox */
    display: flex;
    justify-content: center;
    align-items: center;
}

.image-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
}

.buttons button {
    padding: 8px 0;
    cursor: pointer;
    font-size: 15px;
}
</style>
</head>
<body>
  <div class="viewer">

    <div class="image-container">
        <img id="mainImage"
             src="/images/full/maya/IMG_2867-jpeg.webp"
             alt="">
    </div>

    <div class="buttons">
        <button data-img="IMG_2867-jpeg.webp">1</button>
        <button data-img="IMG_2867-raw-processed.webp">2</button>
        <button data-img="IMG_2867-raw-processed-2.webp">3</button>
        <button data-img="IMG_2867-raw-3.webp">4</button>
        <button data-img="IMG_2867-raw-4.webp">5</button>
        <button data-img="IMG_2867-raw-5.webp">6</button>
        <button data-img="IMG_2867-raw-6.webp">7</button>
        <button data-img="IMG_2867-raw-8.webp">8</button>
    </div>

  </div>

  <script>
  const img = document.getElementById('mainImage');

  document.querySelectorAll('.buttons button').forEach(button => {
      button.addEventListener('click', () => {
          img.src = "/images/full/maya/" + button.dataset.img;
      });
  });
  </script>

  

</body>
</html>
