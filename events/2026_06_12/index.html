  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nav = document.querySelector('.navigation');
      const toggle = document.querySelector('.menu-toggle');
      if (!nav || !toggle) return;
      toggle.addEventListener('click', () => {
        const isOpening = !nav.classList.contains('is-open');
        if (isOpening) {
          nav.classList.add('is-open');
          document.body.classList.add('no-scroll');
          toggle.setAttribute('aria-expanded', 'true');
        } else {
          nav.classList.remove('is-open');
          document.body.classList.remove('no-scroll');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/nanogallery2@3/dist/jquery.nanogallery2.min.js"></script>
  <script>
  const rawItems = [
    {
      "src": "/images/full/events/2026_06_12/IMG_1362.webp",
      "srct": "/images/thumb/events/2026_06_12/IMG_1362.webp",
      "title": "Черна кутия предназначена за постери със завъртян голям бял сол ключ отгоре."
    },
    {
      "src": "/images/full/events/2026_06_12/IMG_1369.webp",
      "srct": "/images/thumb/events/2026_06_12/IMG_1369.webp",
      "title": "Две сиви коли снимани през отвора на ръждясващ оранжев антипаркинг, чийто надпис 'Община Пловдив; Платено паркиране' е извън фокус и се разпада."
    },
    {
      "src": "/images/full/events/2026_06_12/IMG_3093.webp",
      "srct": "/images/thumb/events/2026_06_12/IMG_3093.webp",
      "title": "Изоставено метално колело и дървен материал снимани от прозореца на БДЖ."
    },
    {
      "src": "/images/full/events/2026_06_12/IMG_1478.webp",
      "srct": "/images/thumb/events/2026_06_12/IMG_1478.webp",
      "title": "Бяло-кафява котка ходи по бордюр на ръба на хълм. Градът се вижда на заден фон."
    },
    {
      "src": "/images/full/events/2026_06_12/IMG_1452.webp",
      "srct": "/images/thumb/events/2026_06_12/IMG_1452-1x2.webp",
      "title": "Пожълтял тревен осил на замъглен фон."
    },
    {
      "src": "/images/full/events/2026_06_12/IMG_1487.webp",
      "srct": "/images/thumb/events/2026_06_12/IMG_1487-2x3.webp",
      "title": "Бяла котка с кафеви петна върху павирана пътека близо до растителност. Небето зад нея е облачно и по-светло."
    },
    {
      "src": "/images/full/events/2026_06_12/IMG_1414.webp",
      "srct": "/images/thumb/events/2026_06_12/IMG_1414.webp",
      "title": "Георги Калбаков, момче с бежава блуза и къса коса, под арка от клон на зелен фон на Младежкия хълм в Пловдив."
    },
    {
      "src": "/images/full/events/2026_06_12/IMG_1475_01.webp",
      "srct": "/images/thumb/events/2026_06_12/IMG_1475_01.webp",
      "title": "Жена и момиче, седнали на пейка, на върха на Младежкия хълм в Пловдив."
    },
    {
      "src": "/images/full/events/2026_06_12/IMG_3049.webp",
      "srct": "/images/thumb/events/2026_06_12/IMG_3049.webp",
      "title": "Излегнало се момче в бежава блуза и сини дънки върху камък. Зад него се вижда слънцето през кула антена."
    }
  ];
  
  const responsiveItems = rawItems.map(item => {
    const thumbBase = item.srct.replace(/\.webp$/, '');
    return {
      ...item,
      srct: `${thumbBase}-400w.webp`,
      customData: {
        thumbBase
      }
    };
  });

  jQuery("#gallery").nanogallery2({
    // CONTENT SOURCE
    itemsBaseURL: "",
    items: responsiveItems,
    // GALLERY LAYOUT
    galleryMosaic : [                       // default layout
      { w: 1, h: 2, c: 1, r: 1 },
      { w: 1, h: 1, c: 2, r: 1 },
      { w: 1, h: 1, c: 3, r: 1 },
      { w: 2, h: 1, c: 4, r: 1 },
      { w: 1, h: 2, c: 1, r: 3 },
      { w: 2, h: 3, c: 2, r: 2 },
      { w: 2, h: 2, c: 4, r: 2 },
      { w: 1, h: 1, c: 4, r: 4 },
      { w: 1, h: 1, c: 5, r: 4 }
    ],
    
    galleryMosaicSM : [                     
      // --- BLOCK 1 (Rows 1 to 4) ---
      { w: 1, h: 1, c: 2, r: 4 },
      { w: 1, h: 1, c: 3, r: 6 },
      { w: 1, h: 2, c: 3, r: 4 },
      { w: 2, h: 1, c: 2, r: 3 },
      { w: 1, h: 2, c: 1, r: 3 },
      { w: 2, h: 2, c: 1, r: 1 },
      { w: 1, h: 1, c: 3, r: 2 },
      { w: 1, h: 1, c: 3, r: 1 },
      { w: 2, h: 2, c: 1, r: 5 },
      { w: 2, h: 2, c: 1, r: 5 }
    ],

    galleryMosaicXS : [
      // --- BLOCK 1 (Rows 1 to 5) ---
      { w: 1, h: 1, c: 1, r: 5 },
      { w: 1, h: 1, c: 1, r: 3 },
      { w: 1, h: 1, c: 2, r: 3 },
      { w: 1, h: 1, c: 1, r: 4 },
      { w: 1, h: 2, c: 2, r: 4 },
      { w: 2, h: 2, c: 1, r: 1 },
      { w: 2, h: 2, c: 1, r: 6 },
      { w: 1, h: 1, c: 1, r: 8 },
      { w: 1, h: 1, c: 2, r: 8 },
    ],

    galleryMaxRows: 1,
    galleryDisplayMode: 'rows',

    gallerySorting: 'none',
    thumbnailDisplayOrder: 'none',

    thumbnailHeight: '180', 
    thumbnailWidth: '220',
    //thumbnailAlignment: 'fitWidth',
    thumbnailGutterWidth: 10, 
    thumbnailGutterHeight: 10,
    thumbnailBorderHorizontal: 0, 
    thumbnailBorderVertical: 0,
    thumbnailLabel: { display: false },

    // DISPLAY ANIMATION
    galleryDisplayTransitionDuration: 1500,
    thumbnailDisplayTransition: 'imageSlideUp',
    thumbnailDisplayTransitionDuration: 1200,
    thumbnailDisplayTransitionEasing: 'easeInOutQuint',
    thumbnailDisplayInterval: 60,

    // THUMBNAIL HOVER ANIMATION
    thumbnailBuildInit2: 'image_scale_1.15',
    thumbnailHoverEffect2: 'thumbnail_scale_1.00_1.05_300|image_scale_1.15_1.00',
    touchAnimation: true,
    touchAutoOpenDelay: 500,

    // LIGHTBOX
    viewerTools: {
      // topLeft: 'label',
      topRight: 'shareButton, rotateLeft, rotateRight, fullscreenButton, closeButton'
    },

    // GALLERY THEME
    galleryTheme : { 
      thumbnail: {
        background: '#111'
      },
    },

    // DEEP LINKING
    locationHash: true,

    // RESPONSIVE IMAGES
    fnThumbnailInit: fnThumbnailInitFallback,
  });
  
  function fnThumbnailInitFallback($thumbnail, item) {
    const thumbBase = item.customData?.thumbBase;
    if (!thumbBase) return;

    const bg = `image-set(
      url("${thumbBase}-400w.webp") 1x,
      url("${thumbBase}-800w.webp") 2x,
      url("${thumbBase}-1200w.webp") 3x
    )`;

    $thumbnail.find('.nGY2TnImg').css('background-image', bg);
    $thumbnail.find('img.nGY2TnImg2').attr('src', `${thumbBase}-400w.webp`);
  }
  </script>
